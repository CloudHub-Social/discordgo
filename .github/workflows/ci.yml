name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.25", "1.26"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - name: Offline race suite and examples
        env:
          DG_OAUTH2_TOKEN: ""
          DGB_TOKEN: ""
          DGU_TOKEN: ""
        run: go test -race -count=1 -timeout 180s ./...
      - name: Vet
        run: go vet ./...
      - name: Format changed Go files
        env:
          BASE_REV: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$BASE_REV" =~ ^[0-9a-f]{40}$ ]] || [[ "$BASE_REV" =~ ^0+$ ]]; then
            BASE_REV="HEAD^"
          fi
          bad=$(git diff --name-only --diff-filter=ACMR -z "$BASE_REV" HEAD -- "*.go" | xargs -0 -r gofmt -l)
          if [[ -n "$bad" ]]; then printf "%s\n" "$bad"; exit 1; fi
